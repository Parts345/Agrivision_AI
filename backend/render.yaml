services:
  - type: web
    name: agrivision-ai-backend
    env: python
    plan: starter
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: MODEL_PATH
        value: ../model/model.h5
      - key: ALLOWED_ORIGINS
        value: https://your-frontend.vercel.app
